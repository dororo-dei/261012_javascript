<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <titleFetch 03 - 외부 API 사용자 데이터 출력</title>
    <style>
      #result {
        max-width: 1000px;
        flex-wrap: wrap;
        display: flex;
        gap: 20px;
        background-color: antiquewhite;
      }
      .card {
        flex: 1;
        background-color: aliceblue;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <h1>사용자 데이터 가져오기</h1>
    <button id="loadBtn">데이터 가져오기</button>
    <div id="result">
      <!-- js출력 -->
    </div>
    <script>
      const loadBtn = document.querySelector("#loadBtn");
      const result = document.querySelector("#result");
      loadBtn.addEventListener("click", () => {
        // console.log("click");

        fetch("https://jsonplaceholder.typicode.com/users")
          .then((res) => {
            // console.log(res);
            return res.json();
          })
          .then((data) => {
            // console.log(data);
            result.innerHTML = data
              .map((user) => {
                // console.log(user);
                return `
                <div class="card">
        <h2>${user.name}</h2>
        <p><strong>아이디:${user.id}</strong></p>
        <p><strong>사용자명:${user.username}</strong></p>
        <p><strong>이메일:${user.email}</strong></p>
        <p><strong>전화번호:${user.phone}</strong></p>
        <p><strong>웹사이트:${user.website}</strong></p>
        <p><strong>주소: </strong>
        ${user.address.city} , ${user.address.street} , ${user.address.suite}
        </p>
        <p><strong>우편번호:${user.address.zipcode}</strong></p>
        <p><strong>회사:${user.company.name}</strong></p>
       </div>
                `;
              })
              .join("");
          })
          .catch((error) => {
            console.log(error);
          });
      });
    </script>
  </body>
</html>
