<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>for 01 — 반복문 기초</title>
  </head>

  <body>
    <!-- for 반복문 : 같은 코드를 여러 번 실행할 때 사용하는 반복문 -->

    <script>
      /* =========================
         1. for 반복문 기본 구조
      ========================= */

      // for (초기식; 조건식; 증감식) {
      //   실행 코드
      // }

      // 0부터 4까지 출력
      for (let i = 0; i < 5; i++) {
        // console.log(i); // 0~4까지 출력
      }

      // 1부터 10까지 출력
      for (let i = 1; i <= 10; i++) {
        // console.log(i); // 1~10까지 출력
      }

      /* =========================
         2. 반복문으로 합계 구하기
      ========================= */

      // 1부터 100까지의 합계 계산
      let sum = 0;

      for (let i = 1; i <= 100; i++) {
        sum += i; // sum = sum + i
      }

      // document.write(sum); // 결과: 5050

      /* =========================
         3. 문자열 반복 출력
      ========================= */

      // "안녕하세요" 5번 출력
      for (let i = 1; i <= 5; i++) {
        document.write(`안녕하세요 ${i} 반가워요 <br>`);
      }

      /* =========================
         4. 짝수 출력
      ========================= */

      // 1부터 10까지의 숫자 중 짝수만 출력
      for (let i = 1; i <= 10; i++) {
        // console.log(i);

        // 2로 나눈 나머지가 0이면 짝수
        if (i % 2 === 0) {
          document.write(`${i} (짝수) <br>`);
        }
      }

      /* =========================
         5. 홀수 출력
      ========================= */

      // 1부터 10까지의 숫자 중 홀수만 출력
      for (let i = 1; i <= 10; i++) {
        // console.log(i);

        // 2로 나눈 나머지가 1이면 홀수
        if (i % 2 === 1) {
          document.write(`${i} (홀수) <br>`);
        }
      }

      /* =========================
         6. 별 찍기
      ========================= */

      // repeat() : 문자열을 지정한 횟수만큼 반복
      // i가 1부터 5까지 증가하면서 별의 개수도 증가

      for (let i = 1; i <= 5; i++) {
        document.write(`${"⭐".repeat(i)}<br>`);
      }

      /* =========================
         7. 별 5개 한 번에 출력
      ========================= */

      // 반복문 없이 repeat()으로 별 5개 출력
      document.write("⭐".repeat(5));
    </script>
  </body>
</html>
