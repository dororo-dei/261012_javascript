<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM 01 - 요소생성</title>
  </head>
  <body>
    <div id="container">
      <h1>웹 프로그래밍</h1>
      <!-- p태그 생성 -->
      <!-- js 생성 -->
    </div>
    <div class="notice">
      <!-- span안에 글자 안녕하세요 -->
      <!-- <span>안녕하세요</span> -->
    </div>
    <script>
      // p 태그 생성
      //   createElement() 요소 생성 메서드
      const newP = document.createElement("p"); // dom에 새로운 요소를 만들어라
      console.log(newP);
      //   createTextNode() 글자요소 생성 메서드
      const txtNode = document.createTextNode(
        "DOM은 document object model의 준말이다",
      );
      console.log(txtNode);
      // p태그에 글자를 넣는다
      //   appendChild() 자식 요소를 더하는 메서드
      newP.appendChild(txtNode); // node에 자식을 더해준다, 태그안에 있는 것도 자식
      console.log(newP);
      // container영역 안에 p태그 연결
      document.querySelector("#container").appendChild(newP);

      //   span 태그 생성
      const nopan = document.createElement("span");
      console.log(nopan);
      //   글자 요소 생성
      const text = document.createTextNode("안녕하세요");
      console.log(text);
      //   span 태그에 글자를 넣는다
      nopan.appendChild(text);
      console.log(nopan);
      //   container 영역 안에 span 태그 연결
      document.querySelector(".notice").appendChild(nopan);
    </script>
  </body>
</html>
