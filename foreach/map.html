
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>map() - 배열 데이터 변환</title>
  </head>
  <body>
    <!--
      map()
      배열의 각 요소를 하나씩 꺼내서 콜백 함수를 실행하고,
      반환된 값들을 모아 새로운 배열을 만드는 메서드

      - 원본 배열은 map() 자체에 의해 변경되지 않는다.
      - 각 요소를 변환한 결과로 새로운 배열을 생성한다.
      - 콜백 함수에서 return한 값이 새 배열의 요소가 된다.
    -->

    <script>
      // 01. map() 기본 사용법
      const prices = [1000, 2000, 3000];
      console.log(prices); // [1000, 2000, 3000]

      const newPrices = prices.map((price) => {
        console.log(price); // 1000, 2000, 3000
        return price + 1000; // 각 요소에 1000을 더한 값을 반환
      });

      // 반환된 값들을 모아서 새로운 배열을 만든다.
      console.log(newPrices); // [2000, 3000, 4000]

      // 02. 화살표 함수와 return
      const numbers = [1, 2, 3, 4];

      // 중괄호 {}를 사용하는 경우
      // const result = numbers.map((num) => {
      //   console.log(num);
      //   return num * 2;
      // });

      // 중괄호 {}를 생략하는 경우
      const result = numbers.map((num) => num * 2);

      // 화살표 함수에서 {}를 생략하면 표현식의 결과가 자동으로 반환된다.
      // {}는 객체가 아니라 함수 본문을 감싸는 중괄호이다.
      // {}로 함수 본문을 작성하면 값을 반환할 때 return을 명시해야 한다.

      console.log(result); // [2, 4, 6, 8]

      // 주의사항
      // 중괄호 {}를 사용하면서 return을 생략하면
      // 각 콜백 함수의 반환값이 undefined가 된다.
      //
      // 예시:
      // const result2 = numbers.map((num) => {
      //   num * 2;
      // });
      // console.log(result2);
      // [undefined, undefined, undefined, undefined]
    </script>
  </body>
</html>
