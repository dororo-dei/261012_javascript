
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>forEach() · map() · filter() - 쇼핑몰 상품 관리</title>
    <style>
      button {
        padding: 10px 16px;
        border: none;
        border-radius: 6px;
        background-color: #333;
        color: #fff;
      }

      .product-list {
        width: 90%;
        max-width: 500px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .product {
        background-color: antiquewhite;
      }

      @media (max-width: 390px) {
        .product-list {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <h1>온라인 쇼핑몰</h1>
    <button id="allBtn">전체 상품</button>
    <button id="saleBtn">할인 가격 보기</button>
    <button id="filterBtn">5만원 이하</button>

    <p id="count">
      <!-- js 출력 -->
    </p>

    <div id="productList" class="product-list">
      <!-- js 출력 -->
    </div>

    <script>
      // 상품 데이터
      const products = [
        { id: 1, name: "티셔츠", price: 20000, category: "의류" },
        { id: 2, name: "청바지", price: 45000, category: "의류" },
        { id: 3, name: "운동화", price: 80000, category: "신발" },
        { id: 4, name: "모자", price: 15000, category: "잡화" },
      ];

      // html 요소 가져오기
      const productList = document.querySelector("#productList");
      const count = document.querySelector("#count");
      const allBtn = document.querySelector("#allBtn");
      const saleBtn = document.querySelector("#saleBtn");
      const filterBtn = document.querySelector("#filterBtn");

      // 상품을 화면에 출력하는 공통 함수
      function renderProducts(items) {
        // console.log("상품 확인");
        // console.log(items); // array
        // 매개변수 items를 통해 출력할 상품 배열을 전달받는다.

        // 기존 상품 목록을 초기화하여 중복 출력을 방지
        productList.innerHTML = "";

        items.forEach((product) => {
          // console.log(product);

          productList.innerHTML += `
            <div class="product">
              <h3>${product.name}</h3>
              <p>분류: ${product.category}</p>
              <p class="price">${product.price.toLocaleString()} 원</p>
            </div>
          `;
        });

        // 현재 화면에 출력된 상품 개수
        count.innerText = `총 ${items.length}개의 상품`;
      }

      // map() 모든 상품 가격을 20% 할인한 새 배열 만드는 함수
      function showSaleProducts() {
        // console.log("할인 확인"); // 콘솔에서 확인용

        const saleProduct = products.map((product) => {
          // console.log(product);

          return {
            ...product,

            // ...은 전개 구문(Spread Syntax)
            // 기존 객체의 속성을 새로운 객체에 복사한다.

            // ...을 사용하지 않으면 상품 데이터를 직접 작성해야 한다.
            // id: product.id,
            // name: product.name,
            // price: product.price,
            // category: product.category,

            price: product.price * 0.8,
            // product에 있는 가격에 0.8을 곱해 20% 할인 금액으로 변환
          };
        });

        // console.log(saleProduct);
        renderProducts(saleProduct);
      }

      // filter() 5만원 이하 상품 골라서 새 배열 만들기
      function showCheapProducts() {
        // console.log("필터링");

        const cheapProducts = products.filter((product) => {
          // console.log(product);
          return product.price <= 50000;
        });

        // console.log(cheapProducts); // 조건에 맞는 상품이 배열로 담긴다.
        renderProducts(cheapProducts);
      }

      // renderProducts();

      // forEach() 사용 전체 상품 출력
      allBtn.addEventListener("click", () => {
        renderProducts(products);
        // 콘솔 확인은 allBtn을 click했을 때 확인 가능
      });

      // 화면 로딩될 때 바로 전체 상품 출력
      renderProducts(products);

      // map() 할인 적용
      saleBtn.addEventListener("click", showSaleProducts);
      // 인수를 직접 전달하지 않고 함수를 이벤트 핸들러로 등록할 때
      // 함수 이름 뒤에 ()를 붙이지 않는다.
      // 클릭 이벤트가 발생하면 등록된 함수가 실행된다.

      // filter() 5만원 이하 상품 출력
      filterBtn.addEventListener("click", showCheapProducts);
    </script>
  </body>
</html>
