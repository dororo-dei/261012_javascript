
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>filter() - 조건에 맞는 배열 요소 추출</title>
  </head>
  <body>
    <!--
      filter()
      배열의 각 요소를 하나씩 확인하여
      조건에 맞는 요소만 골라 새로운 배열을 만드는 메서드

      - 조건식의 결과가 true인 요소만 새 배열에 포함된다.
      - 조건식의 결과가 false인 요소는 제외된다.
      - 원본 배열은 filter() 자체에 의해 변경되지 않는다.
      - 조건에 맞는 요소가 없으면 빈 배열 []을 반환한다.
    -->

    <script>
      // 01. filter() 기본 사용법 - 합격 점수 추출
      const scores = [45, 80, 55, 90, 70];
      console.log(scores); // [45, 80, 55, 90, 70]

      const passed = scores.filter((score) => {
        console.log(score); // 45, 80, 55, 90, 70
        return score >= 60; // 60점 이상이면 true
      });

      // 조건에 맞는 요소들만 새로운 배열로 반환된다.
      console.log(passed); // [80, 90, 70]

      // 02. filter() 활용 - 특정 가격 이하 상품 추출
      const prices = [3000, 8000, 5000, 12000, 4000];

      // console.log(prices);
      const result = prices.filter((price) => {
        console.log(price); // 3000, 8000, 5000, 12000, 4000
        return price <= 5000; // 5000원 이하이면 true
      });

      // price는 현재 순회 중인 배열 요소를 받는 매개변수이다.
      // 콜백 함수는 필수이며, 매개변수 이름은 자유롭게 정할 수 있다.
      // 현재 요소를 사용하지 않는다면 매개변수를 생략할 수도 있다.

      console.log(result); // [3000, 5000, 4000]

      // 조건에 맞는 데이터만 화면에 출력
      document.write(result); // 3000,5000,4000

      // => 내가 원하는 요소들만 골라서 출력할 수 있다.
      // document.write()는 배열을 문자열로 변환하여 출력한다.
      // 배열 요소는 쉼표(,)로 구분되어 표시된다.
    </script>
  </body>
</html>
