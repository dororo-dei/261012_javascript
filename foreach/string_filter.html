
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>filter() · includes() - 실시간 상품 검색</title>
  </head>
  <body>
    <h2>상품 검색</h2>

    <!-- 검색창 -->
    <input
      type="text"
      id="search"
      placeholder="상품 이름을 입력하세요"
    />

    <!-- 검색 결과 -->
    <ul id="productList">
      <!-- js로 검색 이름 출력 -->
    </ul>

    <script>
      // 상품 데이터
      const products = ["티셔츠", "청바지", "운동화", "모자", "원피스"];

      // HTML 요소 가져오기
      const search = document.querySelector("#search");
      const productList = document.querySelector("#productList");

      // 상품 출력 함수
      function showProductList(items) {
        // 기존 검색 결과를 초기화하여 중복 출력 방지
        productList.innerHTML = "";

        // console.log(items); // 배열 형태로 전달됨

        items.forEach((product) => {
          // console.log(product);
          // forEach()는 배열의 요소를 하나씩 꺼내 콜백 함수를 실행한다.

          productList.innerHTML += `
            <li>${product}</li>
          `;

          // li가 여러 개이므로 += 를 사용해 기존 HTML에 추가한다.
        });
      }

      // 입력창에 입력하면 input 이벤트 발생
      search.addEventListener("input", () => {
        // 입력창에 작성된 현재 문자열 가져오기
        const keyword = search.value;

        // console.log(keyword);

        // 글자가 포함된 상품만 찾기
        const result = products.filter((product) => {
          // console.log(product);

          // includes()는 문자열에 특정 문자열이 포함되어 있는지 확인한다.
          // 포함되어 있으면 true, 없으면 false를 반환한다.
          return product.includes(keyword);
        });

        // console.log(result);

        // 검색 결과 출력
        showProductList(result);
      });

      // 페이지 로딩 시 전체 상품 목록 출력
      showProductList(products);
    </script>
  </body>
</html>
